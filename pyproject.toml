[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "anim-gen"
version = "0.1.0"
description = "Animal image generation with GANs (DCGAN, ResNet-SNGAN) and diffusion (DDPM/DDIM), in plain PyTorch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.scripts]
anim-train = "anim_gen.train:main"
anim-sample = "anim_gen.sample:main"
anim-fid = "anim_gen.fid:main"
anim-prepare = "anim_gen.prepare:main"

[project.optional-dependencies]
hf = ["datasets>=3.6"]  # anim-prepare --source hf:... (AFHQ and other Hub datasets)
tensorboard = ["tensorboard>=2.15"]
dev = ["pytest>=8", "ruff>=0.9", "scipy>=1.11", "nbformat>=5.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/anim_gen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
