[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tiny-imagegen"
version = "0.1.0"
description = "Animal image generation with GANs (DCGAN, ResNet-SNGAN) and diffusion (DDPM/DDIM), in plain PyTorch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.scripts]
imagegen-train = "imagegen.train:main"
imagegen-sample = "imagegen.sample:main"
imagegen-fid = "imagegen.fid:main"
imagegen-prepare = "imagegen.prepare:main"

[project.optional-dependencies]
hf = ["datasets>=3.6"]  # imagegen-prepare --source hf:... (AFHQ and other Hub datasets)
tensorboard = ["tensorboard>=2.15"]
dev = ["pytest>=8", "ruff>=0.9", "scipy>=1.11", "nbformat>=5.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/imagegen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
